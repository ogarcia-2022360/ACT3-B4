<div class="carrito-container">
  <h2>Tu Carrito de Compras</h2>

  <div *ngIf="(carrito$ | async) as items">
    <p *ngIf="items.length === 0">El carrito está vacío.</p>

    <table *ngIf="items.length > 0" class="tabla-carrito">
      <thead>
        <tr>
          <th>Producto</th>
          <th>Precio</th>
          <th>Cantidad</th>
          <th>Subtotal</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items">
          <td>{{ item.nombre }}</td>
          <td>{{ item.precio | currency:'USD' }}</td>
          <td>
            <input 
              type="number" 
              [value]="item.cantidad" 
              min="1"
              (change)="cambiarCantidad(item.id, $event)" />
          </td>
          <td>{{ item.precio | subtotal:(item.cantidad || 1) | currency:'USD' }}</td>
          <td>
            <button (click)="eliminar(item.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="items.length > 0" class="total-seccion">
      <h3>Total: {{ items | totalCarrito | currency:'USD' }}</h3>
    </div>
  </div>
</div>
